name: Release Cyberpunk RED - ND Core

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Foundry manifest and JSON
        run: node scripts/validate-system.mjs

      - name: Check JavaScript syntax
        shell: bash
        run: |
          mapfile -d '' sources < <(
            find . \
              -type d \( -name .git -o -name .github -o -name node_modules -o -name dist \) -prune \
              -o -type f -name '*.js' -print0
          )
          for source in "${sources[@]}"; do
            node --check "$source"
          done

      - name: Build Foundry archive and release manifest
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('system.json', 'utf8')).version")"
          expected_tag="v${version#v}"
          if [[ "$tag" != "$expected_tag" ]]; then
            echo "Tag $tag does not match system.json version $version" >&2
            exit 1
          fi

          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          git archive "$GITHUB_SHA" | tar -x -C "$staging"
          rm -rf "$staging/.github" "$staging/scripts"

          manifest_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/system.json"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/cyberpunk-red-nd-core-${tag}.zip"
          jq --arg manifest "$manifest_url" --arg download "$download_url" \
            '.manifest = $manifest | .download = $download' \
            "$staging/system.json" > "$staging/system.json.tmp"
          mv "$staging/system.json.tmp" "$staging/system.json"

          mkdir -p dist
          cp "$staging/system.json" dist/system.json
          (
            cd "$staging"
            zip -qr "$GITHUB_WORKSPACE/dist/cyberpunk-red-nd-core-${tag}.zip" .
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/system.json" \
            "dist/cyberpunk-red-nd-core-${GITHUB_REF_NAME}.zip" \
            --title "Cyberpunk RED - ND Core $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            --repo "$GITHUB_REPOSITORY"
