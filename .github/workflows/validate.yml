name: Validate CPR Core

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Foundry manifest and JSON
        run: node scripts/validate-system.mjs

      - name: Check JavaScript syntax
        shell: bash
        run: |
          mapfile -d '' sources < <(
            find . \
              -type d \( -name .git -o -name .github -o -name node_modules -o -name dist \) -prune \
              -o -type f -name '*.js' -print0
          )
          for source in "${sources[@]}"; do
            node --check "$source"
          done
